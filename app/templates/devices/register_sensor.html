{% extends "base.html" %}
{% block title %}Đăng ký cảm biến - {{ site_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h4 class="mb-3">Đăng ký cảm biến mới</h4>
    <p class="text-muted">Cảm biến này đang gửi dữ liệu vào InfluxDB nhưng chưa gắn với kho nào trong hệ thống.</p>
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Mã cảm biến (khớp InfluxDB)</label>
        <input type="text" name="sensor_code" class="form-control" value="{{ sensor_code }}" required {% if sensor_code %}readonly{% endif %}>
      </div>
      <div class="mb-3">
        <label class="form-label">Tên cảm biến</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Kho</label>
        <select name="warehouse_id" class="form-select" required>
          <option value="">-- Chọn kho --</option>
          {% for w in warehouses %}
          <option value="{{ w.id }}">{{ w.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="row">
        <div class="col mb-3">
          <label class="form-label">Ngưỡng cảnh báo (°C)</label>
          <input type="number" step="0.1" name="warning_threshold" class="form-control">
        </div>
        <div class="col mb-3">
          <label class="form-label">Ngưỡng nguy hiểm (°C)</label>
          <input type="number" step="0.1" name="critical_threshold" class="form-control">
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Đăng ký</button>
      <a href="{{ url_for('devices.index') }}" class="btn btn-outline-secondary">Hủy</a>
    </form>
  </div>
</div>
{% endblock %}
